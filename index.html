<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClutterScope — UI Mockup</title>
<style>
  :root{
    --accent:#3b82f6;--accent-2:#6366f1;--accent-dark:#2563eb;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;
    --sidebar:#0f172a;--radius:14px;
    --page-a:#dde6f7;--page-b:#e6ebf5;--page-c:#f1f3f9;
    --bg:#eef1f6;--panel:#fff;--panel-2:#fbfcfe;--soft:#f7f9fc;--chip:#f1f5fb;--track:#eef1f7;
    --ink:#0f172a;--ink-2:#334155;--muted:#64748b;--line:#e7eaf0;--line-2:#c9d6ee;
    --good-bg:#dcfce7;--good-ink:#15803d;--fair-bg:#fef3c7;--fair-ink:#92400e;--poor-bg:#fee2e2;--poor-ink:#b91c1c;
    --info-bg:#eff6ff;--info-bg-2:#f5f3ff;--info-line:#d7e3fb;--ok-bg:#f0fdf4;--ok-line:#c6f0d8;--bad-line:#fbcdcd;
    --t-ren-bg:#ffedd5;--t-ren:#c2410c;--t-arc-bg:#e0e7ff;--t-arc:#4338ca;--t-del-bg:#fee2e2;--t-del:#b91c1c;--t-keep-bg:#f1f5f9;--t-keep:#475569;
    --shadow-win:0 24px 60px rgba(15,23,42,.22);
    --shadow-card:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.06);
    --actionbar:rgba(255,255,255,.94);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --page-a:#1a2440;--page-b:#0b1120;--page-c:#111827;
    --bg:#0e1626;--panel:#141d30;--panel-2:#111a2b;--soft:#18233a;--chip:#1c2842;--track:#1f2a42;
    --ink:#e6ecf6;--ink-2:#c5cfe1;--muted:#8d9ab3;--line:#243150;--line-2:#34456b;
    --good-bg:rgba(34,197,94,.16);--good-ink:#4ade80;--fair-bg:rgba(245,158,11,.16);--fair-ink:#fbbf24;--poor-bg:rgba(239,68,68,.16);--poor-ink:#f87171;
    --info-bg:rgba(59,130,246,.12);--info-bg-2:rgba(99,102,241,.1);--info-line:rgba(99,130,246,.3);--ok-bg:rgba(34,197,94,.1);--ok-line:rgba(34,197,94,.3);--bad-line:rgba(239,68,68,.35);
    --t-ren-bg:rgba(249,115,22,.16);--t-ren:#fb923c;--t-arc-bg:rgba(99,102,241,.2);--t-arc:#a5b4fc;--t-del-bg:rgba(239,68,68,.16);--t-del:#f87171;--t-keep-bg:#1c2842;--t-keep:#c5cfe1;
    --shadow-win:0 24px 60px rgba(0,0,0,.5);--shadow-card:0 1px 2px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.18);
    --actionbar:rgba(20,29,48,.94);
    color-scheme:dark;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 70% -10%,var(--page-a),transparent),linear-gradient(135deg,var(--page-b),var(--page-c));min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink)}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none!important}

  .window{width:min(1240px,100%);height:min(800px,calc(100vh - 48px));min-height:560px;background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-win);border:1px solid var(--line);display:flex;flex-direction:column;position:relative}
  .titlebar{height:40px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .wm{color:var(--muted);font-weight:400}
  .winbtns{margin-left:auto;display:flex;gap:8px}
  .winbtns span{width:12px;height:12px;border-radius:50%}
  .c1{background:#febc2e}.c2{background:#28c840}.c3{background:#ff5f57}
  .body{flex:1;display:flex;min-height:0}

  /* sidebar */
  .sidebar{width:246px;background:linear-gradient(180deg,var(--sidebar),#111a30);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0;padding:20px 14px;overflow-y:auto}
  .logo-row{display:flex;align-items:center;gap:11px;padding:0 6px 18px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800;box-shadow:0 6px 16px rgba(59,130,246,.45);flex-shrink:0}
  .logo-row b{font-size:15px;color:#fff}
  .logo-row small{display:block;font-size:10.5px;color:#7c8aa5;font-weight:400;margin-top:1px}
  .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#5b6781;padding:6px 10px;margin-top:6px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;font-size:13px;white-space:nowrap;color:#aeb9d0;cursor:pointer;margin-bottom:2px;transition:.15s;width:100%;background:none;border:none;text-align:left}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:linear-gradient(135deg,rgba(59,130,246,.9),rgba(99,102,241,.9));color:#fff;box-shadow:0 6px 18px rgba(59,130,246,.35)}
  .nav-item .nico{width:22px;display:flex;justify-content:center;font-size:15px;flex-shrink:0}
  .nav-item .nbadge{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:1px 8px}
  .nav-item .nbadge:empty{display:none}
  .nav-item.active .nbadge{background:rgba(255,255,255,.28)}
  .side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7c8aa5;display:flex;align-items:center;gap:8px}
  .dot-ok{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;flex-shrink:0}

  .main{flex:1;background:var(--bg);display:flex;flex-direction:column;min-width:0}
  .toolbar{min-height:60px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:8px 24px;gap:14px;flex-shrink:0}
  .toolbar h1{font-size:16px;margin:0;font-weight:650}
  .toolbar .crumb{font-size:11.5px;color:var(--muted);margin-top:1px}
  .toolbar .right{margin-left:auto;display:flex;gap:9px;align-items:center}
  .scroll{flex:1;overflow:auto;padding:22px 24px 24px}
  .scroll::-webkit-scrollbar{width:9px}.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
  .page{display:none}.page.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .btn{border:none;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 18px rgba(59,130,246,.25)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:var(--panel);color:var(--ink-2);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--soft);border-color:var(--line-2)}
  .btn.danger{background:var(--poor-bg);color:var(--poor-ink);border:1px solid var(--bad-line)}
  .btn.danger-solid{background:#dc2626;color:#fff}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
  .btn.xs{padding:4px 9px;font-size:11.5px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
  .link{background:none;border:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit}
  .link:hover{text-decoration:underline}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-card)}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
  .card-h .aside{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--muted)}
  .lead{font-size:13px;color:var(--muted);max-width:720px;line-height:1.55;margin:0 0 16px}
  .section-h{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 10px;display:flex;align-items:center;gap:10px}
  .section-h .aside{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;font-size:11.5px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .muted{color:var(--muted)}
  .mono{font-family:Consolas,monospace}
  .spacer{flex:1}
  .note{font-size:12px;color:var(--ink-2);background:linear-gradient(135deg,var(--info-bg),var(--info-bg-2));border:1px solid var(--info-line);border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
  .empty{font-size:12.5px;color:var(--muted);text-align:center;padding:26px}

  /* badges, pills, chips */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .good{background:var(--good-bg);color:var(--good-ink)}.fair{background:var(--fair-bg);color:var(--fair-ink)}.poor{background:var(--poor-bg);color:var(--poor-ink)}
  .risk .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .conf{font-size:10.5px;color:var(--muted);font-weight:600;margin-left:6px;white-space:nowrap}
  .chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--ink-2);margin:2px 4px 2px 0;white-space:nowrap}
  .chip.bad{background:var(--poor-bg);color:var(--poor-ink)}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .tag.rename{background:var(--t-ren-bg);color:var(--t-ren)}.tag.archive{background:var(--t-arc-bg);color:var(--t-arc)}
  .tag.delete{background:var(--t-del-bg);color:var(--t-del)}.tag.keep{background:var(--t-keep-bg);color:var(--t-keep)}
  .score{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
  .score .mini{width:54px;height:6px;background:var(--track);border-radius:4px;overflow:hidden}
  .score .mini i{display:block;height:100%;border-radius:4px}
  .bar{flex:1;height:8px;background:var(--track);border-radius:5px;overflow:hidden;min-width:50px}
  .bar i{display:block;height:100%;border-radius:5px}

  /* DASHBOARD */
  .hello{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hello h2{margin:0;font-size:18px}
  .hello p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-top:16px}
  .kpi{padding:14px 15px;display:flex;flex-direction:column;gap:4px}
  .kpi .kl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
  .kpi .kv{font-size:26px;font-weight:800;line-height:1.1}
  .kpi .ks{font-size:11.5px;color:var(--muted)}
  .stack{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--track);margin:4px 16px 12px}
  .stack i{display:block;height:100%}
  .legend-row{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:12.5px;border-top:1px solid var(--line)}
  .legend-row .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .legend-row b{margin-left:auto}
  .mini-row{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:12.5px;border-top:1px solid var(--line)}
  .mini-row .nm{flex:1;min-width:0}
  .mini-row .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-row .nm small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  /* SCAN */
  .folder-row{display:flex;align-items:center;gap:13px;padding:12px 15px;font-size:13px;border-top:1px solid var(--line)}
  .folder-row .ic{width:34px;height:34px;border-radius:9px;background:var(--info-bg);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .folder-row .path{flex:1;font-family:Consolas,monospace;color:var(--ink-2);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .folder-row .sz{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .x{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;background:none;border:none;flex-shrink:0}
  .x:hover{background:var(--poor-bg);color:var(--bad)}
  .add{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:13px;border:1.5px dashed var(--line-2);border-radius:11px;margin:8px;background:var(--soft);width:calc(100% - 16px)}
  .add:hover{background:var(--info-bg)}
  .scan-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
  .rules{padding:0 16px 12px 34px;margin:0;font-size:12px;color:var(--ink-2);line-height:1.75}
  .progress-card{padding:26px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
  .ring{position:relative;width:128px;height:128px}.ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .track{stroke:var(--track)}
  .steps{list-style:none;margin:0;padding:0;font-size:12.5px}
  .steps li{display:flex;align-items:center;gap:10px;padding:4px 0;color:var(--muted)}
  .steps li .sd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
  .steps li.done{color:var(--ink-2)}.steps li.done .sd{background:var(--ok);border-color:var(--ok);color:#fff}
  .steps li.now{color:var(--ink);font-weight:700}.steps li.now .sd{border-color:var(--accent);background:var(--info-bg)}
  .stat-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .stat{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:9px 16px;min-width:96px}
  .stat b{display:block;font-size:19px}.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .cur{font-family:Consolas,monospace;font-size:11.5px;color:var(--muted);background:var(--chip);padding:7px 12px;border-radius:8px;margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .done-card{padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .done-card .big{font-size:32px}
  .done-card h3{margin:0 0 3px;font-size:16px}
  .done-card p{margin:0;font-size:12.5px;color:var(--muted)}
  .pick-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;width:100%;background:var(--panel);text-align:left}
  .pick-row:hover:not(:disabled){border-color:var(--line-2);background:var(--soft)}
  .pick-row:disabled{cursor:default;opacity:.7}
  .pick-row.blocked{opacity:.85}
  .pick-row .pp{flex:1;min-width:0;font-family:Consolas,monospace;font-size:12.5px}
  .pick-row small{display:block;font-family:"Segoe UI",system-ui,sans-serif;font-size:11px;color:var(--muted)}

  /* tables */
  .tbl-wrap{overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl .fname{font-weight:600;color:var(--ink);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl .fpath{font-family:Consolas,monospace;font-size:10.5px;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl tr.row{cursor:pointer}
  .tbl tr.row:hover td{background:var(--soft)}
  .tbl tr.open td{background:var(--soft);border-bottom-color:transparent}
  .tbl .num{text-align:right;white-space:nowrap}
  .tbl .caret{color:var(--muted);width:18px;text-align:center;padding-right:0}
  .expl td{background:var(--soft);padding:4px 16px 16px}
  .expl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
  .comp{font-size:12px}
  .comp .ch{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}
  .comp .ch b{white-space:nowrap}
  .comp p{margin:5px 0 0;font-size:11.5px;color:var(--muted)}
  .expl-foot{grid-column:1/-1;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 11px;flex:1 1 180px;max-width:300px}
  .search:focus-within{border-color:var(--accent)}
  .search input{border:none;outline:none;background:none;padding:7px 0;font-size:12.5px;flex:1;min-width:0}
  .select{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .seg button{border:none;background:none;padding:7px 13px;font-size:12px;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .seg button .n{opacity:.75;font-weight:700;margin-left:5px}
  .formula{font-family:Consolas,monospace;font-size:11px;color:var(--muted);padding:12px 14px 0;text-align:center;line-height:1.7}

  /* RECOMMENDATIONS */
  .rec{display:grid;grid-template-columns:auto minmax(180px,1fr) auto minmax(220px,1.15fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
  .rec:first-child{border-top:none}
  .rec input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
  .rec .orig{min-width:0}
  .rec .orig div{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec .orig small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .rec .arrow{color:var(--muted);font-size:16px}
  .rec .sug input{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:Consolas,monospace;background:var(--panel)}
  .rec .sug input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .rec .sug small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .rec .acts{display:flex;gap:6px}
  .grp-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px}
  .grp-row:first-child{border-top:none}
  .grp-row .gi{min-width:0;flex:1}
  .grp-row .gi div{font-weight:600}
  .grp-row .gi small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* CLUTTER MANAGEMENT */
  .dupgrp{margin-bottom:12px;overflow:hidden}
  .dup-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dup-h .gi{flex:1;min-width:0}
  .dup-h .gi div{font-weight:700;font-size:13px}
  .dup-h .gi small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

    act.forEach(f=>{ const k=collKey(f.name); (byKey[k]=byKey[k]||[]).push(f); (byDir[f.dir]=byDir[f.dir]||[]).push(f); if(f.h)(byHash[f.h]=byHash[f.h]||[]).push(f); });
    act.forEach(f=>{ f.dupCopy=false; f.dupOf=null; f.copies=[]; });
    Object.values(byHash).forEach(g=>{ if(g.length<2) return;
      const orig=[...g].sort((a,b)=>depthOf(a.dir)-depthOf(b.dir)||collKey(a.name).length-collKey(b.name).length||a.name.length-b.name.length)[0];
      g.forEach(f=>{ if(f!==orig){ f.dupCopy=true; f.dupOf=orig; orig.copies.push(f); } }); });
    act.forEach(f=>{
      const m=tokens(f.name).filter(meaningful);
      const d=m.length>=2?1:m.length===1?.5:0;
      const hasDate=DATE_RE.test(baseName(f.name).toLowerCase());
      const others=new Set(byDir[f.dir].filter(o=>o!==f).flatMap(o=>tokens(o.name)));
      const uniq=m.filter(t=>!others.has(t));
      const t=(hasDate?.5:0)+(uniq.length?.5:0);
      const col=byKey[collKey(f.name)].filter(o=>o!==f);
      const c=col.length===0?1:col.length===1?.5:0;
      const dep=depthOf(f.dir), gdir=f.dir.split('\\').some(s=>GENERIC_DIR.test(s));
      let p=dep<=3?1:dep<=DEPTH_MAX?.6:.2; if(gdir) p=Math.max(0,+(p-.3).toFixed(2));
      f.comp={d,t,c,p,m,hasDate,uniq,col,dep,gdir};
      f.score=Math.round(FW.d*d+FW.t*t+FW.c*c+FW.p*p);
      f.risk=f.score>=70?'F':f.score>=45?'U':'L';
      const dist=Math.min(Math.abs(f.score-70),Math.abs(f.score-45));
      f.conf=Math.min(.97,.55+dist/40);
      f.unused=f.u>=UNUSED_MONTHS; f.deep=dep>DEPTH_MAX; f.naming=d<1||c<1;
      f.ind=[];
      if(f.dupCopy) f.ind.push(['Duplicate copy',1]);
      if(f.unused) f.ind.push(['Unused '+f.u+' mo',1]);
      if(f.deep) f.ind.push(['Deep path ('+dep+' levels)',1]);
      if(d<1) f.ind.push([d===0?'Generic name':'Few descriptive words',0]);
      if(t===0) f.ind.push(['No distinguishing terms',0]);
      if(c<1) f.ind.push(['Similar name ×'+col.length,0]);
    });
    act.forEach(f=>f.rec=mapAction(f));
    FOLDERS=Object.keys(byDir).map(dir=>{
      const fs=byDir[dir], n=fs.length, dep=depthOf(dir);
      const dup=fs.filter(f=>f.dupCopy).length, un=fs.filter(f=>f.unused).length;
      const avgF=fs.reduce((a,f)=>a+f.score,0)/n;
      const sev={dup:Math.min(1,dup/n/.3),depth:dep>DEPTH_MAX?1:dep>=4?.4:0,unused:Math.min(1,un/n/.5),find:(100-avgF)/100};
      const clutter=Math.round(CW.dup*sev.dup+CW.depth*sev.depth+CW.unused*sev.unused+CW.find*sev.find);
      return {dir,files:fs,n,dep,dup,un,avgF,sev,clutter};
    }).sort((a,b)=>b.clutter-a.clutter);
    updateBadges();
  }
  // deterministic action mapping (R1–R5)
  function mapAction(f){
    if(f.status==='kept') return {a:null,rule:'—',why:'Kept by user'};
    if(f.dupCopy) return {a:'delete',rule:'R1',why:'Identical content to '+f.dupOf.name+' (SHA-256 match) — keep the original'};
    if(f.conf<CONF_MIN) return {a:'keep',rule:'R2',why:'Prediction confidence '+Math.round(f.conf*100)+'% is below '+CONF_MIN*100+'% — no action by default'};
    if(f.risk!=='F'&&f.naming) return {a:'rename',rule:'R3',why:'Predicted '+RISK[f.risk].label+'; '+namingIssue(f)};
    if(f.unused) return {a:'archive',rule:'R4',why:'Not opened or modified for '+f.u+' months (≥ '+UNUSED_MONTHS+')'};
    return {a:'keep',rule:'R5',why:f.ind.length?'Findable despite minor indicators':'No issues detected'};
  }
  function namingIssue(f){ const c=f.comp, p=[];
    if(c.d===0) p.push('no descriptive words'); else if(c.d<1) p.push('only one descriptive word');

  const RISK={F:{label:'Findable',cls:'good',color:'#16a34a'},U:{label:'Uncertain',cls:'fair',color:'#f59e0b'},L:{label:'Likely Lost',cls:'poor',color:'#ef4444'}};
  const fBand=s=>s>=70?'good':s>=45?'fair':'poor';
  const fColor=s=>s>=70?'#16a34a':s>=45?'#f59e0b':'#ef4444';

  const cColor=s=>s<=30?'#16a34a':s<=60?'#f59e0b':'#ef4444';
  const riskPill=f=>'<span class="pill risk '+RISK[f.risk].cls+'"><span class="dot"></span>'+RISK[f.risk].label+'</span><span class="conf">'+Math.round(f.conf*100)+'%</span>';
  const scorePill=s=>'<span class="score" style="color:'+fColor(s)+'">'+s+'<span class="mini"><i style="width:'+s+'%;background:'+fColor(s)+'"></i></span></span>';
  const clutterPill=s=>'<span class="pill '+cBand(s).cls+'">'+s+' · '+cBand(s).label+'</span>';
  const ACT={rename:{icon:'🏷️',label:'Rename',verb:'Renamed'},archive:{icon:'📦',label:'Archive',verb:'Archived'},delete:{icon:'🗑️',label:'Delete',verb:'Deleted'},keep:{icon:'✋',label:'Keep',verb:'Kept'}};
  const actTag=a=>a?'<span class="tag '+a+'">'+ACT[a].icon+' '+ACT[a].label+'</span>':'<span class="muted">—</span>';
  const indChips=f=>f.ind.length?f.ind.map(i=>'<span class="chip'+(i[1]?' bad':'')+'">'+i[0]+'</span>').join(''):'<span class="muted" style="font-size:11.5px">None</span>';
  const shortDir=dir=>{const p=dir.split('\\'); return p.length>4?p[0]+'\\…\\'+p.slice(-2).join('\\'):dir;};

  function stats(){
    const act=scanned(), n=act.length;
    const risk={F:0,U:0,L:0}; act.forEach(f=>risk[f.risk]++);
    const recs=act.filter(f=>f.rec.a&&!f.dismissed);
    const cnt=a=>recs.filter(f=>f.rec.a===a&&(a!=='keep'||f.rec.rule==='R2')).length;   // "keep" counts only low-confidence reviews
    const dupCopies=act.filter(f=>f.dupCopy), unused=act.filter(f=>f.unused);
    return {act,n,risk,recs,rename:cnt('rename'),archive:cnt('archive'),delete:cnt('delete'),keep:cnt('keep'),
      actionable:cnt('rename')+cnt('archive')+cnt('delete'),dupCopies,dupMB:dupCopies.reduce((a,f)=>a+f.mb,0),unused,
      avgF:n?act.reduce((a,f)=>a+f.score,0)/n:0,clutter:n?FOLDERS.reduce((a,fo)=>a+fo.clutter*fo.n,0)/n:0,
      totalMB:act.reduce((a,f)=>a+f.mb,0),folders:FOLDERS.length,deep:FOLDERS.filter(fo=>fo.dep>DEPTH_MAX).length};
  }
  function updateBadges(){ const st=stats(); $('nb-recs').textContent=(st.actionable+st.keep)||''; $('nb-clutter').textContent=(st.dupCopies.length+st.unused.length)||''; }

  /* ================= NAVIGATION ================= */
  const META={

  /* ================= DASHBOARD ================= */
  const kpi=(ic,l,v,s,to,color)=>'<div class="card kpi"><div class="kl">'+ic+' '+l+'</div><div class="kv"'+(color?' style="color:'+color+'"':'')+'>'+v+'</div><div class="ks">'+s+'</div></div>';

            '<div class="bar" style="max-width:110px"><i style="width:'+fo.clutter+'%;background:'+cColor(fo.clutter)+'"></i></div>'+clutterPill(fo.clutter)+'</div>').join('')+

  /* ================= SCAN ================= */
  let scanTimer=null;

  function rootFiles(r){ return FS.filter(f=>rootOf(f)===r&&(f.status==='active'||f.status==='kept')); }
  function renderScan(){
    const P=$('scan');

      '<div class="card progress-card"><div class="ring"><svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true"><circle class="track" cx="64" cy="64" r="53" fill="none" stroke-width="12"/>'+
      '<circle id="scan-arc" cx="64" cy="64" r="53" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round" stroke-dasharray="333" stroke-dashoffset="333"/>'+
      '<defs><linearGradient id="g1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs></svg><div class="pct" id="scan-pct">0%</div></div>'+
      '<div style="min-width:0"><h3 style="margin:0 0 10px;font-size:17px">Scanning '+plural(pendingRoots.length,'folders')+'…</h3><ol class="steps" id="scan-steps">'+
      STEPS.map((s,i)=>'<li><span class="sd">'+(i+1)+'</span>'+s+'</li>').join('')+'</ol>'+

      '<div class="card done-card"><span class="big">✅</span><div><h3>Scan complete</h3><p>'+plural(st.n,'files')+' in '+plural(st.folders,'folders')+' · average findability <b style="color:'+fColor(st.avgF)+'">'+Math.round(st.avgF)+'</b> · '+
      (st.risk.U+st.risk.L)+' at-risk files · '+st.actionable+' recommended actions</p></div></div>':'')+
      '<div class="scan-grid"><div class="card"><div class="card-h">📁 Folders to scan<span class="aside">'+plural(pendingRoots.length,'folders')+' selected</span></div>'+

          :'<div class="empty" style="border-top:1px solid var(--line)">No folders selected. Add at least one folder to scan.</div>')+

  /* ================= FILE ANALYSIS ================= */
  function renderAnalysis(){
    const P=$('analysis'), st=stats();
    let html='<div class="tools"><div class="seg" role="group"><button aria-pressed="'+(ui.afTab==='files')+'" onclick="ui.afTab=\'files\';renderAnalysis()">📄 Files<span class="n">'+st.n+'</span></button>'+

        '<select class="select" id="af-sort" aria-label="Sort"><option value="score">Lowest score first</option><option value="score-d">Highest score first</option><option value="name">Name A–Z</option><option value="conf">Lowest confidence</option></select></div>';
      const rows=st.act.filter(f=>(ui.risk==='all'||f.risk===ui.risk)&&(!ui.q||(f.name+' '+f.dir).toLowerCase().includes(ui.q.toLowerCase())));
      rows.sort(ui.sort==='name'?(a,b)=>a.name.localeCompare(b.name):ui.sort==='score-d'?(a,b)=>b.score-a.score:ui.sort==='conf'?(a,b)=>a.conf-b.conf:(a,b)=>a.score-b.score);
      html+='<div class="card tbl-wrap"><table class="tbl"><thead><tr><th></th><th>File</th><th>Findability</th><th>Retrieval risk</th><th>Indicators</th><th>Recommended</th></tr></thead><tbody>'+
        (rows.length?rows.map(f=>{const o=ui.open.has('f'+f.id);
          return '<tr class="row'+(o?' open':'')+'" data-open="f'+f.id+'" tabindex="0"><td class="caret">'+(o?'▾':'▸')+'</td><td><div class="fname" title="'+esc(f.name)+'">'+esc(f.name)+'</div><div class="fpath" title="'+esc(ROOT+'\\'+f.dir)+'">'+esc(ROOT+'\\'+f.dir)+'</div></td>'+
            '<td>'+scorePill(f.score)+'</td><td style="white-space:nowrap">'+riskPill(f)+'</td><td>'+indChips(f)+'</td><td>'+(f.dismissed?'<span class="muted" style="font-size:11.5px">Cancelled</span>':actTag(f.rec.a))+'</td></tr>'+
            (o?'<tr class="expl"><td colspan="6">'+explainFile(f)+'</td></tr>':'');}).join('')
          :'<tr><td colspan="6" class="empty">No files match these filters.</td></tr>')+'</tbody></table></div>'+
        '<div class="formula">Findability = '+FW.d+'·D + '+FW.t+'·T + '+FW.c+'·C + '+FW.p+'·P   (D descriptiveness · T distinguishing terms · C name collisions · P path context, each 0–1)<br>Findable ≥ 70 · Uncertain 45–69 · Likely Lost &lt; 45 · placeholder weights, subject to adviser review</div>';
    } else {
      html+='</div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Folder</th><th class="num">Files</th><th class="num">Depth</th><th class="num">Duplicates</th><th class="num">Unused</th><th>Avg findability</th><th>Clutter score</th></tr></thead><tbody>'+

          return '<tr class="row'+(o?' open':'')+'" data-open="d'+esc(fo.dir)+'" tabindex="0"><td class="caret">'+(o?'▾':'▸')+'</td><td><div class="fpath" style="font-size:12px;color:var(--ink-2);max-width:380px" title="'+esc(ROOT+'\\'+fo.dir)+'">'+esc(ROOT+'\\'+fo.dir)+'</div></td>'+
            '<td class="num">'+fo.n+'</td><td class="num"'+(fo.dep>DEPTH_MAX?' style="color:var(--poor-ink);font-weight:700"':'')+'>'+fo.dep+'</td><td class="num">'+fo.dup+'</td><td class="num">'+fo.un+'</td><td>'+scorePill(Math.round(fo.avgF))+'</td><td>'+clutterPill(fo.clutter)+'</td></tr>'+
            (o?'<tr class="expl"><td colspan="8">'+explainFolder(fo)+'</td></tr>':'');}).join('')+'</tbody></table></div>'+
        '<div class="formula">Clutter = '+CW.dup+'·duplicates + '+CW.depth+'·depth + '+CW.unused+'·unused + '+CW.find+'·(1 − avg findability ÷ 100)   (each 0–1; higher = more cluttered)<br>Low ≤ 30 · Moderate 31–60 · High &gt; 60 · placeholder weights, subject to adviser review</div>';
    }
    P.innerHTML=html;
    const q=$('af-q'); if(q) q.oninput=e=>{ ui.q=e.target.value; const pos=e.target.selectionStart; renderAnalysis(); const n=$('af-q'); n.focus(); n.setSelectionRange(pos,pos); };

  }
  $('analysis').addEventListener('click',e=>{ const r=e.target.closest('tr.row'); if(!r) return; const k=r.dataset.open; ui.open.has(k)?ui.open.delete(k):ui.open.add(k); renderAnalysis(); });
  $('analysis').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.row')){ e.preventDefault(); e.target.click(); } });
  const comp=(label,pts,max,desc)=>'<div class="comp"><div class="ch"><span>'+label+'</span><b>'+(+pts.toFixed(1))+' / '+max+'</b></div><div class="bar"><i style="width:'+(pts/max*100)+'%;background:var(--accent)"></i></div><p>'+desc+'</p></div>';
  function explainFile(f){ const c=f.comp;

      comp('Distinguishing terms (T)',FW.t*c.t,FW.t,(c.hasDate?'Has a date or version':'No date or version')+' · '+(c.uniq.length?'unique in folder: '+c.uniq.slice(0,3).join(', '):'no term unique in its folder'))+

  /* ================= RECOMMENDATIONS ================= */
  function suggestionFor(f){
    if(sugg[f.id]!=null) return sugg[f.id];
    let s=SUGGEST[f.name];
    if(!s){ const e=extOf(f.name), seg=f.dir.split('\\').filter(x=>!GENERIC_DIR.test(x)).pop()||'Files';
      s=({docx:'Document',xlsx:'Spreadsheet',pdf:'Document',txt:'Notes',png:'Image',jpg:'Image',mp4:'Video',pptx:'Presentation'}[e]||'File')+'_'+seg.replace(/[^A-Za-z0-9]/g,'')+'_2026'+(e?'.'+e:''); }
    const taken=n=>scanned().some(o=>o!==f&&o.dir===f.dir&&o.name.toLowerCase()===n.toLowerCase());
    if(taken(s)){ const b=baseName(s), e=s.slice(b.length); let i=2; while(taken(b+'_'+i+e)) i++; s=b+'_'+i+e; }
    return s;
  }
  function renderRecs(){
    const st=stats(), P=$('recs');
    const ren=st.recs.filter(f=>f.rec.a==='rename').sort((a,b)=>a.score-b.score);
    const del=st.recs.filter(f=>f.rec.a==='delete'), arc=st.recs.filter(f=>f.rec.a==='archive'), keep=st.recs.filter(f=>f.rec.a==='keep'&&f.rec.rule==='R2');
    const dism=st.act.filter(f=>f.dismissed&&f.rec.a);
    ui.recSel=new Set([...ui.recSel].filter(id=>ren.some(f=>f.id===id)));
    P.innerHTML=
      '<p class="lead">Each recommendation is derived from the file’s predicted retrieval risk and detected indicators. Review the suggested filename, edit it if needed, then confirm — a confirmation dialog always appears before any change.</p>'+
      '<div class="section-h">🏷️ Rename suggestions <span class="muted" style="text-transform:none;letter-spacing:0">('+ren.length+')</span><span class="aside">'+
        (ren.length?'<button class="btn primary xs" '+(ui.recSel.size?'':'disabled')+' onclick="requestRename([...ui.recSel].map(i=>FS[i]))">Confirm selected ('+ui.recSel.size+')</button>':'')+'</span></div>'+
      '<div class="card">'+(ren.length?ren.map(f=>
        '<div class="rec"><input type="checkbox" data-rsel="'+f.id+'" '+(ui.recSel.has(f.id)?'checked':'')+' aria-label="Select '+esc(f.name)+'">'+
        '<div class="orig"><div title="'+esc(fullPath(f))+'">'+esc(f.name)+'</div><small>'+riskPill(f)+' · score '+f.score+' · '+esc(shortDir(f.dir))+'</small></div>'+
        '<span class="arrow">→</span><div class="sug"><input data-sug="'+f.id+'" value="'+esc(suggestionFor(f))+'" aria-label="Suggested filename for '+esc(f.name)+'"><small>'+f.rec.rule+': '+esc(f.rec.why)+'</small></div>'+
        '<div class="acts"><button class="btn primary xs" data-ren="'+f.id+'">Confirm rename</button><button class="btn ghost xs" data-dis="'+f.id+'">Cancel</button></div></div>').join('')
        :'<div class="empty">🎉 No rename suggestions — all scanned filenames are descriptive enough.</div>')+'</div>'+
      '<div class="section-h">🧹 Archive and delete<span class="aside">Applied from Clutter Management</span></div><div class="card">'+
        grpRow('delete',del,'duplicate copies — keep the original, send copies to the Recycle Bin')+
        grpRow('archive',arc,'unused ≥ '+UNUSED_MONTHS+' months but still findable — move to ClutterScope Archive')+
      '</div>'+
      '<div class="section-h">✋ Keep <span class="muted" style="text-transform:none;letter-spacing:0">('+keep.length+')</span><span class="aside">Low-confidence predictions default to no action</span></div>'+
      '<div class="card">'+(keep.length?keep.map(f=>'<div class="grp-row">'+actTag('keep')+'<div class="gi"><div>'+esc(f.name)+'</div><small>'+f.rec.rule+': '+esc(f.rec.why)+' · '+esc(shortDir(f.dir))+'</small></div><span style="white-space:nowrap">'+riskPill(f)+'</span>'+
        '<button class="btn ghost xs" data-keep="'+f.id+'">Confirm keep</button></div>').join(''):'<div class="empty">Nothing to review.</div>')+'</div>'+
      (dism.length?'<div class="section-h">↩ Cancelled suggestions <span class="aside"><button class="link" onclick="ui.showDismissed=!ui.showDismissed;renderRecs()">'+(ui.showDismissed?'Hide':'Show')+' ('+dism.length+')</button></span></div>'+
        (ui.showDismissed?'<div class="card">'+dism.map(f=>'<div class="grp-row">'+actTag(f.rec.a)+'<div class="gi"><div>'+esc(f.name)+'</div><small>'+esc(f.rec.why)+'</small></div><button class="btn ghost xs" data-undis="'+f.id+'">Restore</button></div>').join('')+'</div>':''):'');
  }
  function grpRow(a,list,desc){
    return '<div class="grp-row">'+actTag(a)+'<div class="gi"><div>'+plural(list.length,'files')+' · '+desc+'</div><small>'+(list.length?list.slice(0,4).map(f=>esc(f.name)).join(', ')+(list.length>4?', …':''):'None')+'</small></div>'+

  }
  $('recs').addEventListener('input',e=>{ if(e.target.dataset.sug!=null) sugg[e.target.dataset.sug]=e.target.value; });
  $('recs').addEventListener('change',e=>{ const id=e.target.dataset.rsel; if(id==null) return; e.target.checked?ui.recSel.add(+id):ui.recSel.delete(+id); renderRecs(); });
  $('recs').addEventListener('click',e=>{

    if(d.ren!=null) requestRename([FS[+d.ren]]);

    if(d.undis!=null){ FS[+d.undis].dismissed=false; refresh(); }
    if(d.keep!=null) requestAction('keep',[FS[+d.keep]]);
  });

  /* ================= CLUTTER MANAGEMENT ================= */
  function renderClutter(){
    const st=stats(), P=$('clutter');
    const groups=st.act.filter(f=>f.copies&&f.copies.length);
    ui.sel=new Set([...ui.sel].filter(id=>st.act.some(f=>f.id===id&&(ui.cmTab==='dups'?f.dupCopy:f.unused))));
    let html='<div class="tools"><div class="seg" role="group"><button aria-pressed="'+(ui.cmTab==='dups')+'" onclick="ui.cmTab=\'dups\';ui.sel.clear();renderClutter()">🗂️ Duplicate files<span class="n">'+st.dupCopies.length+'</span></button>'+
      '<button aria-pressed="'+(ui.cmTab==='unused')+'" onclick="ui.cmTab=\'unused\';ui.sel.clear();renderClutter()">🕓 Unused files<span class="n">'+st.unused.length+'</span></button></div><span class="spacer"></span>'+
      '<span class="muted" style="font-size:12px">'+(ui.cmTab==='dups'?fmtMB(st.dupMB)+' recoverable from '+plural(groups.length,'duplicate groups'):'Not opened or modified for '+UNUSED_MONTHS+'+ months · '+fmtMB(st.unused.reduce((a,f)=>a+f.mb,0)))+'</span></div>';

      html+=groups.length?groups.map(o=>{
        const all=[o,...o.copies];
        return '<div class="card dupgrp"><div class="dup-h"><span style="font-size:20px">🗂️</span><div class="gi"><div>'+esc(o.name)+' — '+all.length+' identical files</div>'+
          '<small class="mono">SHA-256 '+fakeHash(o.h)+' · '+fmtMB(o.mb)+' each · '+fmtMB(o.mb*o.copies.length)+' recoverable</small></div>'+
          '<button class="btn ghost xs" data-selgrp="'+o.id+'">Select copies</button></div>'+
          all.map(f=>f===o
            ?'<div class="irow orig"><span style="width:16px;text-align:center;color:var(--good-ink)">✓</span><div class="col"><div>'+esc(f.name)+'</div><small>'+esc(ROOT+'\\'+f.dir)+'</small></div><span class="pill good">Original · keep</span></div>'
            :'<label class="irow'+(ui.sel.has(f.id)?' sel':'')+'"><input type="checkbox" data-sel="'+f.id+'" '+(ui.sel.has(f.id)?'checked':'')+'><div class="col"><div>'+esc(f.name)+'</div><small>'+esc(ROOT+'\\'+f.dir)+'</small></div>'+
              '<span class="meta">last used '+lastUsed(f)+'</span>'+actTag('delete')+'</label>').join('')+'</div>';}).join('')
        :'<div class="card empty">🎉 No duplicate files in the scanned folders.</div>';
    } else {
      html+=st.unused.length?'<div class="card">'+[...st.unused].sort((a,b)=>b.u-a.u).map(f=>
        '<label class="irow'+(ui.sel.has(f.id)?' sel':'')+'"><input type="checkbox" data-sel="'+f.id+'" '+(ui.sel.has(f.id)?'checked':'')+'><div class="col"><div>'+esc(f.name)+'</div><small>'+esc(ROOT+'\\'+f.dir)+'</small></div>'+
        '<span class="meta">last used '+lastUsed(f)+'<br>'+f.u+' months · '+fmtMB(f.mb)+'</span>'+actTag(f.rec.a)+'</label>').join('')+'</div>'
        :'<div class="card empty">🎉 No unused files in the scanned folders.</div>';
    }
    const sel=[...ui.sel].map(id=>FS[id]);
    html+='<div class="actionbar"><span class="selinfo"><b>'+sel.length+'</b> selected <span class="muted" style="font-weight:400">'+(sel.length?'· '+fmtMB(sel.reduce((a,f)=>a+f.mb,0)):'')+'</span></span><span class="spacer"></span>'+
      '<button class="btn ghost sm" '+(sel.length?'':'disabled')+' onclick="requestAction(\'archive\',[...ui.sel].map(i=>FS[i]))">📦 Archive</button>'+
      '<button class="btn danger sm" '+(sel.length?'':'disabled')+' onclick="requestAction(\'delete\',[...ui.sel].map(i=>FS[i]))">🗑️ Delete to Recycle Bin</button></div>';
    P.innerHTML=html;
  }
  $('clutter').addEventListener('change',e=>{ const id=e.target.dataset.sel; if(id==null) return; e.target.checked?ui.sel.add(+id):ui.sel.delete(+id); renderClutter(); });
  $('clutter').addEventListener('click',e=>{ const b=e.target.closest('[data-selgrp]'); if(!b) return; FS[+b.dataset.selgrp].copies.forEach(c=>ui.sel.add(c.id)); renderClutter(); });
  function fakeHash(h){ let x=7; for(const ch of 'clutterscope-'+h) x=(Math.imul(x,31)+ch.charCodeAt(0))>>>0; const y=Math.imul(x,2654435761)>>>0; const hex=(x.toString(16).padStart(8,'0')+y.toString(16).padStart(8,'0')); return hex.slice(0,8)+'…'+hex.slice(8,16); }

  /* ================= ACTIONS: confirm → apply → log → rescore ================= */
  const ARCHIVE_DIR='ClutterScope Archive';
  function requestRename(files){
    if(!files.length) return;
    openDialog({icon:'🏷️',title:files.length>1?'Rename '+files.length+' files?':'Rename this file?',sub:'Check the new names. Nothing changes until you click Rename.',
      body:files.map((f,i)=>'<div class="ren-row"><div class="ren-old">'+esc(f.name)+' · <span class="mono">'+esc(shortDir(f.dir))+'</span></div><input class="ren-input" data-i="'+i+'" value="'+esc(suggestionFor(f))+'" aria-label="New name for '+esc(f.name)+'"></div>').join(''),
      reassure:'✏ <span>Only the filename changes — contents and location stay the same. The action is logged and can be undone from Action History.</span>',
      ok:'Rename',onOk:()=>{
        const inputs=[...document.querySelectorAll('#dlg-body .ren-input')], names=inputs.map(x=>x.value.trim()); let err='';
        inputs.forEach((x,i)=>{ x.classList.remove('err'); const n=names[i], f=files[i];
          if(!n||/[\\/:*?"<>|]/.test(n)){ x.classList.add('err'); err='Enter a valid filename (no \\ / : * ? " < > |).'; return; }
          if(extOf(n)!==extOf(f.name)){ x.classList.add('err'); err='Keep the original file extension (.'+extOf(f.name)+').'; return; }
          const clash=scanned().some(o=>o!==f&&o.dir===f.dir&&o.name.toLowerCase()===n.toLowerCase())||names.some((m,j)=>j!==i&&files[j].dir===f.dir&&m.toLowerCase()===n.toLowerCase());
          if(clash){ x.classList.add('err'); err='“'+n+'” already exists in that folder — choose a different name.'; } });
        if(err){ showErr(err); return false; }
        apply('rename',files,names);
      }});
  }
  function requestAction(a,files){
    if(!files.length) return;
    const total=files.reduce((s,f)=>s+f.mb,0);
    const cfg={
      archive:{icon:'📦',title:'Archive '+plural(files.length,'files')+'?',ok:'Archive',reassure:'📦 <span>Files move to <b>'+ROOT+'\\'+ARCHIVE_DIR+'</b>, keeping their folder structure. Nothing is deleted, and you can undo from Action History.</span>'},
      delete:{icon:'🗑️',title:'Delete '+plural(files.length,'files')+' to the Recycle Bin?',ok:'Delete to Recycle Bin',danger:true,reassure:'♻ <span>Files go to the <b>Windows Recycle Bin</b> — never erased permanently. You can restore them or undo from Action History.</span>'},
      keep:{icon:'✋',title:'Keep '+(files.length>1?plural(files.length,'files'):'this file')+'?',ok:'Keep',reassure:'✋ <span>No change is made to the file. The recommendation is marked as reviewed and logged.</span>'}
    }[a];
    openDialog({icon:cfg.icon,title:cfg.title,sub:'Review the items below. The action only runs when you confirm.',
      body:'<div class="summary">'+files.map(f=>'<div class="li"><span>'+esc(f.name)+'</span><span>'+fmtMB(f.mb)+'</span></div>').join('')+
        (files.length>1?'<div class="li" style="font-weight:700"><span>'+plural(files.length,'files')+'</span><span>'+fmtMB(total)+'</span></div>':'')+'</div>',
      reassure:cfg.reassure,ok:cfg.ok,okClass:cfg.danger?'danger-solid':'primary',onOk:()=>apply(a,files)});
  }
  function apply(a,files,names){
    const batch=++batchSeq, t=new Date();
    files.forEach((f,i)=>{
      const from={name:f.name,dir:f.dir,status:f.status,dismissed:f.dismissed};
      if(a==='rename'){ f.name=names[i]; delete sugg[f.id]; }
      if(a==='archive') f.status='archived';
      if(a==='delete') f.status='deleted';
      if(a==='keep') f.status='kept';
      LOG.push({id:LOG.length+1,batch,time:t,type:a,fileId:f.id,from,to:{name:f.name,dir:f.dir,status:f.status},undone:null});
      ui.sel.delete(f.id); ui.recSel.delete(f.id);
    });
    closeDialog(); refresh();
    toast(ACT[a].verb+' '+(files.length===1?files[0].name:plural(files.length,'files'))+' · scores updated',()=>undoBatch(batch));
  }
  function canUndo(e){ return !e.undone&&!LOG.some(x=>x.fileId===e.fileId&&!x.undone&&x.id>e.id); }
  function undoEntry(e,silent){
    if(!canUndo(e)) return false;
    const f=FS[e.fileId]; f.name=e.from.name; f.dir=e.from.dir; f.status=e.from.status; f.dismissed=e.from.dismissed; e.undone=new Date();
    if(!silent){ refresh(); toast('Undid: '+ACT[e.type].verb.toLowerCase()+' '+e.from.name+' · scores updated'); }
    return true;
  }
  function undoBatch(b){ let n=0; LOG.filter(e=>e.batch===b&&!e.undone).reverse().forEach(e=>{ if(undoEntry(e,true)) n++; }); refresh(); toast(n?'Undid '+plural(n,'actions')+' · scores updated':'Nothing to undo'); }
  function refresh(){ computeAll(); render(); }

  /* ================= ACTION HISTORY ================= */
  function destOf(e){
    if(e.type==='rename') return '<div class="fname">'+esc(e.to.name)+'</div>';
    if(e.type==='archive') return '<div class="fpath" style="max-width:230px" title="'+esc(ROOT+'\\'+ARCHIVE_DIR+'\\'+e.from.dir)+'">📦 '+esc(ARCHIVE_DIR+'\\'+shortDir(e.from.dir))+'</div>';
    if(e.type==='delete') return '<span class="muted">♻ Recycle Bin</span>';
    return '<span class="muted">No change</span>';
  }
  function renderHistory(){
    const P=$('history');
    const list=LOG.filter(e=>ui.histFilter==='all'||e.type===ui.histFilter).slice().reverse();
    P.innerHTML='<div class="tools"><div class="seg" role="group">'+[['all','All'],['rename','Rename'],['archive','Archive'],['delete','Delete'],['keep','Keep']].map(r=>
      '<button aria-pressed="'+(ui.histFilter===r[0])+'" onclick="ui.histFilter=\''+r[0]+'\';renderHistory()">'+r[1]+'<span class="n">'+(r[0]==='all'?LOG.length:LOG.filter(e=>e.type===r[0]).length)+'</span></button>').join('')+
      '</div><span class="spacer"></span><span class="muted" style="font-size:12px">Newest first · stored locally</span></div>'+
      '<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Date & time</th><th>Action</th><th>Original filename</th><th>New filename / location</th><th>Status</th><th></th></tr></thead><tbody>'+
      (list.length?list.map(e=>{ const ok=canUndo(e);
        return '<tr'+(e.undone?' class="undone"':'')+'><td style="white-space:nowrap">'+fmtDT(e.time)+'</td><td>'+actTag(e.type)+'</td>'+

  const REPORTS={findability:'Findability Report',risk:'Retrieval-Risk Report',clutter:'Clutter Report',action:'Action Report'};
  function reportData(k){
    const st=stats();
    if(k==='findability'){
      const rows=[...st.act].sort((a,b)=>a.score-b.score), band={good:0,fair:0,poor:0}; rows.forEach(f=>band[fBand(f.score)]++);
      return {tiles:[['Files',st.n],['Avg findability',Math.round(st.avgF)],['Good (≥ 70)',band.good],['Fair (45–69)',band.fair],['Poor (< 45)',band.poor]],
        head:['File','Findability','Indicators','Retrieval risk'],
        rows:rows.map(f=>['<div class="fname" style="max-width:240px">'+esc(f.name)+'</div><div class="fpath" style="max-width:240px">'+esc(shortDir(f.dir))+'</div>',scorePill(f.score),'<div style="min-width:220px">'+indChips(f)+'</div>','<span style="white-space:nowrap">'+riskPill(f)+'</span>']),
        csv:[['File','Folder','Findability','D','T','C','P','Indicators','Retrieval risk','Confidence']].concat(rows.map(f=>[f.name,ROOT+'\\'+f.dir,f.score,f.comp.d,f.comp.t,f.comp.c,f.comp.p,f.ind.map(i=>i[0]).join('; '),RISK[f.risk].label,f.conf.toFixed(2)])),
        limit:15,note:'Findability = '+FW.d+'·D + '+FW.t+'·T + '+FW.c+'·C + '+FW.p+'·P (placeholder weights).'};
    }
    if(k==='risk'){
      const rows=st.act.filter(f=>f.risk!=='F').sort((a,b)=>({L:0,U:1}[a.risk]-{L:0,U:1}[b.risk])||a.score-b.score);
      const pct=c=>st.n?Math.round(c/st.n*100)+'%':'0%';
      return {tiles:[['Files',st.n],['Findable',st.risk.F+' · '+pct(st.risk.F)],['Uncertain',st.risk.U+' · '+pct(st.risk.U)],['Likely Lost',st.risk.L+' · '+pct(st.risk.L)]],
        stack:true,head:['At-risk file','Folder','Findability','Predicted risk · confidence','Recommended action'],
        rows:rows.map(f=>['<div class="fname">'+esc(f.name)+'</div>','<span class="fpath">'+esc(shortDir(f.dir))+'</span>',scorePill(f.score),'<span style="white-space:nowrap">'+riskPill(f)+'</span>',actTag(f.dismissed?null:f.rec.a)]),
        csv:[['File','Folder','Findability','Retrieval risk','Confidence','Recommended action']].concat(st.act.map(f=>[f.name,ROOT+'\\'+f.dir,f.score,RISK[f.risk].label,f.conf.toFixed(2),f.rec.a||''])),
        note:'Classes: Findable, Uncertain, Likely Lost. Below '+CONF_MIN*100+'% confidence the recommended action defaults to Keep.'};
    }
    if(k==='clutter'){
      return {tiles:[['Overall clutter',Math.round(st.clutter)+' · '+cBand(st.clutter).label],['Folders',st.folders],['Duplicate copies',st.dupCopies.length+' · '+fmtMB(st.dupMB)],['Unused files',st.unused.length],['Folders deeper than '+DEPTH_MAX,st.deep]],
        head:['Folder','Files','Depth','Duplicates','Unused','Avg findability','Clutter score'],
        rows:FOLDERS.map(fo=>['<span class="fpath" style="color:var(--ink-2);font-size:11.5px;max-width:340px;display:block" title="'+esc(ROOT+'\\'+fo.dir)+'">'+esc(ROOT+'\\'+fo.dir)+'</span>',fo.n,fo.dep,fo.dup,fo.un,scorePill(Math.round(fo.avgF)),clutterPill(fo.clutter)]),
        csv:[['Folder','Files','Depth','Duplicates','Unused','Avg findability','Clutter score','Level']].concat(FOLDERS.map(fo=>[ROOT+'\\'+fo.dir,fo.n,fo.dep,fo.dup,fo.un,Math.round(fo.avgF),fo.clutter,cBand(fo.clutter).label])),
        note:'Clutter = '+CW.dup+'·duplicates + '+CW.depth+'·depth + '+CW.unused+'·unused + '+CW.find+'·low findability (placeholder weights; higher = more cluttered).'};
    }
    const c=a=>LOG.filter(e=>e.type===a&&!e.undone).length;
    return {tiles:[['Actions',LOG.length],['Renamed',c('rename')],['Archived',c('archive')],['Deleted',c('delete')],['Kept',c('keep')],['Undone',LOG.filter(e=>e.undone).length]],
      head:['Date & time','Action','Original filename','New filename / location','Undo status'],
      rows:LOG.map(e=>['<span style="white-space:nowrap">'+fmtDT(e.time)+'</span>',actTag(e.type),'<div class="fname">'+esc(e.from.name)+'</div>',destOf(e),e.undone?'<span class="st-undone">Undone '+fmtTime(e.undone)+'</span>':canUndo(e)?'<span class="st-applied">Applied · undo available</span>':'<span class="st-applied">Applied</span>']),
      csv:[['Date','Time','Action','Original filename','Original folder','New filename','Destination','Undo status']].concat(LOG.map(e=>[fmtDate(e.time),fmtTime(e.time),ACT[e.type].label,e.from.name,ROOT+'\\'+e.from.dir,e.to.name,e.type==='archive'?ROOT+'\\'+ARCHIVE_DIR+'\\'+e.from.dir:e.type==='delete'?'Recycle Bin':ROOT+'\\'+e.to.dir,e.undone?'Undone':'Applied'])),
      note:'Every action required confirmation. Deletions go to the Windows Recycle Bin.'};
  }

  function downloadCSV(rows,name){

  }

  function taskPrompt(f){ const n=SUGGEST[f.origName]||f.origName; return tokens(n).filter(t=>!/^\d+$/.test(t)||t.length===4).join(' ').replace(/\b\w/g,c=>c.toUpperCase())+' ('+extOf(f.name).toUpperCase()+')'; }
  const labelFor=r=>!r||r.n<10?null:r.s>=8?'F':r.s>=4?'U':'L';

  }
  let toastT=null, toastFn=null;
  function toast(msg,undoFn){ toastFn=undoFn||null; $('toast-msg').textContent=msg; $('toast-undo').hidden=!toastFn; $('toast').classList.add('show'); clearTimeout(toastT); toastT=setTimeout(hideToast,4500); }
  function hideToast(){ $('toast').classList.remove('show'); }
  function toastUndo(){ const f=toastFn; toastFn=null; hideToast(); if(f) f(); }
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&$('dlg').classList.contains('show')){ closeDialog(); return; }
    const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing&&!$('dlg').classList.contains('show')){
      const last=[...LOG].reverse().find(x=>!x.undone); if(last){ e.preventDefault(); undoBatch(last.batch); } }
  });

  /* ================= INIT ================= */
  resetFS();
  S={id:'s0',date:new Date(),roots:['Documents','Downloads','Desktop']};
  computeAll();
  $('nav-testing').hidden=!settings.researcher;
  applyTheme();
  go('dashboard');
</script>
</body>
</html>
